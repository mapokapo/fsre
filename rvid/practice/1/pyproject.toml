[project]
name = "rvid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leo Petrović", email = "leopetrovic11@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "matplotlib-stubs>=0.3.11",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
rvid = "rvid:main"

[[tool.uv.index]]
url = "https://cdproxy.sportradar.online/pypi/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
